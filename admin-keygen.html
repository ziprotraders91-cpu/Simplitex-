<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpliTex Admin — Key Generator</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0b0d12; color: #f9fafb; padding: 14px; }
    .wrap { max-width: 520px; margin: 0 auto; }
    .card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 14px; padding: 18px; margin-bottom: 14px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0 0 14px; font-size: 12px; color: #9ca3af; }
    label { display: block; font-size: 12px; font-weight: 600; color: #9ca3af; margin: 10px 0 4px; }
    input {
      width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #30363d;
      background: #0d1117; color: #fff; font-size: 15px;
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn {
      padding: 10px 14px; border: none; border-radius: 8px; font-weight: 700;
      font-size: 13px; cursor: pointer; color: #fff; background: #2563eb;
    }
    .btn-green { background: #16a34a; }
    .btn-gray { background: #374151; }
    .btn-red { background: #dc2626; padding: 5px 9px; font-size: 11px; }
    .code-box {
      margin-top: 14px; padding: 14px; background: #052e16; border: 1px solid #16a34a;
      border-radius: 10px; text-align: center; display: none;
    }
    .code-val { font-size: 22px; font-weight: 900; letter-spacing: 2px; color: #86efac; margin: 6px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    th, td { border-bottom: 1px solid #30363d; padding: 8px 4px; text-align: left; }
    th { color: #9ca3af; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>🔐 SimpliTex Master Keygen</h1>
      <p>Sirf Admin ke liye — Payment milne par Client ki Device ID se Unlock Code banayein</p>

      <label>Client / Dukan ka Naam (Yaad rakhne ke liye)</label>
      <input id="clientName" placeholder="e.g. Azad Saree Center, Mau" />

      <label>Client ki Device ID *</label>
      <input id="deviceId" placeholder="e.g. STX-A1B2C3" style="text-transform:uppercase;" />

      <label>Kitne Din ke Liye Unlock Karna Hai?</label>
      <div class="btn-row">
        <button class="btn btn-gray" onclick="setDays(30)">+30 Din (1 Mahina)</button>
        <button class="btn btn-gray" onclick="setDays(90)">+90 Din (3 Mahine)</button>
        <button class="btn btn-gray" onclick="setDays(365)">+365 Din (1 Saal)</button>
      </div>

      <label>Ya Khud Expiry Date Chunein *</label>
      <input type="date" id="expiryDate" />

      <button class="btn btn-green" style="width:100%; margin-top:14px; font-size:15px;" onclick="generateCode()">
        ⚡ Unlock Code Banayein
      </button>

      <div id="resultBox" class="code-box">
        <small style="color:#bbf7d0;">Client ko ye Code bhejein:</small>
        <div id="generatedCode" class="code-val"></div>
        <div class="btn-row" style="justify-content:center;">
          <button class="btn btn-gray" onclick="copyCode()">📋 Copy Code</button>
          <button class="btn btn-green" onclick="shareWhatsApp()">💬 WhatsApp Bhejein</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h1 style="font-size:16px;">📒 Mere Paying Clients List</h1>
      <p>Agle mahine 1 click me renew karne ke liye</p>
      <table>
        <thead><tr><th>Dukan</th><th>Device ID</th><th>Valid Till</th><th>Action</th></tr></thead>
        <tbody id="clientsBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // NOTE: Ye SECRET bilkul app.js ke MASTER_SECRET se match hona chahiye!
    const MASTER_SECRET = 'SIMPLITEX_MAU_2026_SECRET';
    let lastCode = '', lastClient = '', lastYMD = '';

    function makeSignature(text) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      const full = text + '|' + MASTER_SECRET;
      for (let i = 0; i < full.length; i++) {
        const ch = full.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return ((h2 >>> 0).toString(36) + (h1 >>> 0).toString(36)).toUpperCase().slice(0, 6);
    }

    function setDays(days) {
      const d = new Date(Date.now() + days * 86400000);
      const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      document.getElementById('expiryDate').value = iso;
    }

    function generateCode() {
      const dev = document.getElementById('deviceId').value.trim().toUpperCase();
      const dateStr = document.getElementById('expiryDate').value;
      const cName = document.getElementById('clientName').value.trim() || 'Client';

      if (!dev) return alert('Client ki Device ID daalein!');
      if (!dateStr) return alert('Expiry Date chunein!');

      const ymdStr = dateStr.replace(/-/g, '');
      const sig = makeSignature(dev + '|' + ymdStr);
      const code = `${ymdStr}-${sig}`;

      lastCode = code;
      lastClient = cName;
      lastYMD = dateStr;

      document.getElementById('generatedCode').textContent = code;
      document.getElementById('resultBox').style.display = 'block';

      // Client history me save
      const list = JSON.parse(localStorage.getItem('simplitex_admin_clients') || '[]');
      const idx = list.findIndex((x) => x.deviceId === dev);
      const rec = { name: cName, deviceId: dev, validTill: dateStr, lastCode: code };
      if (idx >= 0) list[idx] = rec; else list.unshift(rec);
      localStorage.setItem('simplitex_admin_clients', JSON.stringify(list));
      renderClients();
    }

    function copyCode() {
      navigator.clipboard?.writeText(lastCode);
      alert('Code Copy ho gaya: ' + lastCode);
    }

    function shareWhatsApp() {
      const msg = `*SimpliTex Renewal Code*\nDukan: ${lastClient}\nValid Till: ${lastYMD}\nUnlock Code: *${lastCode}*\n\nApp me code daal kar Unlock kar lein.`;
      window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
    }

    function quickRenew(name, dev) {
      document.getElementById('clientName').value = name;
      document.getElementById('deviceId').value = dev;
      setDays(30);
      generateCode();
    }

    function removeClient(dev) {
      let list = JSON.parse(localStorage.getItem('simplitex_admin_clients') || '[]');
      list = list.filter((x) => x.deviceId !== dev);
      localStorage.setItem('simplitex_admin_clients', JSON.stringify(list));
      renderClients();
    }

    function renderClients() {
      const list = JSON.parse(localStorage.getItem('simplitex_admin_clients') || '[]');
      document.getElementById('clientsBody').innerHTML = list.map((c) => `
        <tr>
          <td><b>${c.name}</b></td>
          <td>${c.deviceId}</td>
          <td>${c.validTill}</td>
          <td style="white-space:nowrap;">
            <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="quickRenew('${c.name.replace(/'/g, '')}','${c.deviceId}')">+30d</button>
            <button class="btn btn-red" onclick="removeClient('${c.deviceId}')">X</button>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="4" style="color:#6b7280;">Abhi koi client nahi hai</td></tr>';
    }

    setDays(30);
    renderClients();
  </script>
</body>
</html>
